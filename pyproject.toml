[project]
name = "paragliding-site-federation"
version = "0.1.0"
description = "Cross-references national paragliding site guides against ParaglidingEarth and proposes reviewed links as pull requests."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "rapidfuzz>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
