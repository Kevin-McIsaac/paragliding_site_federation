name: Sync

on:
  schedule:
    - cron: "0 2 * * 1" # weekly, Monday 02:00 UTC
  workflow_dispatch: {}

concurrency:
  group: sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: Fetch, match, and propose a PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e .

      - name: Run pipeline
        run: python -m src.pipeline

      - name: Read PR metadata
        id: pr
        run: |
          echo "has_changes=$(cat .pr/has_changes.txt)" >> "$GITHUB_OUTPUT"
          echo "title=$(cat .pr/title.txt)" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        if: steps.pr.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: sync/federation
          delete-branch: false
          title: ${{ steps.pr.outputs.title }}
          body-path: .pr/body.md
          commit-message: "Site federation sync"
          add-paths: |
            links/
            unmatched/
            state/
